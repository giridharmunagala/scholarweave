<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScholarWeave</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d7d87" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Local-first research paper assistant and visual LLM agent builder." />
    <script>
      // Resolve the saved theme before first paint so there is no flash of the wrong palette.
      (function () {
        var themes = ['paper', 'slate'];
        var preference = 'paper';
        try {
          var saved = localStorage.getItem('scholarweave-theme');
          if (saved === 'system' || themes.indexOf(saved) >= 0) preference = saved;
        } catch (error) {
          /* Storage can be unavailable; the default is fine. */
        }
        var resolved = preference;
        if (preference === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'slate' : 'paper';
        }
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
