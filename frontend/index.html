<!doctype html>
<html lang="en" data-theme="light" data-theme-preference="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScholarWeave</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f8f9fb" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Local-first workspace for research papers, notes, and agent-assisted analysis." />
    <script>
      // Resolve the saved theme before first paint so there is no flash of the wrong palette.
      // Mirrors readStoredPreference() in src/shared/theme/themes.ts, including the one-time
      // move from the retired themes to the closest current one.
      (function () {
        var themes = ['light', 'sepia', 'dark'];
        var legacy = {
          prism: 'light', cloud: 'light', snow: 'light', mint: 'light', blossom: 'light',
          paper: 'sepia', citrus: 'sepia', sunrise: 'sepia',
          nebula: 'dark', slate: 'dark', nord: 'dark', aurora: 'dark', forest: 'dark', amoled: 'dark'
        };
        var preference = 'light';
        try {
          var version = localStorage.getItem('scholarweave-theme-version');
          if (version !== '3') {
            var old = localStorage.getItem('scholarweave-theme');
            if (old && !version && old === 'paper') localStorage.removeItem('scholarweave-theme');
            else if (old && Object.prototype.hasOwnProperty.call(legacy, old)) localStorage.setItem('scholarweave-theme', legacy[old]);
            localStorage.setItem('scholarweave-theme-version', '3');
          }
          var saved = localStorage.getItem('scholarweave-theme');
          if (saved === 'system' || themes.indexOf(saved) >= 0) preference = saved;
        } catch (error) {
          /* Storage can be unavailable; the default is fine. */
        }
        var resolved = preference;
        if (preference === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
