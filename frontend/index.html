<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScholarWeave</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6246ea" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Local-first workspace for research papers, notes, and agent-assisted analysis." />
    <script>
      // Resolve the saved theme before first paint so there is no flash of the wrong palette.
      // Mirrors readStoredPreference() in src/shared/theme/themes.ts, including the one-time
      // move off the old "paper" default.
      (function () {
        var themes = ['prism', 'paper', 'cloud', 'snow', 'mint', 'blossom', 'citrus', 'sunrise', 'nebula', 'slate', 'nord', 'aurora', 'forest', 'amoled'];
        var preference = 'prism';
        try {
          if (localStorage.getItem('scholarweave-theme-version') !== '2') {
            if (localStorage.getItem('scholarweave-theme') === 'paper') localStorage.removeItem('scholarweave-theme');
            localStorage.setItem('scholarweave-theme-version', '2');
          }
          var saved = localStorage.getItem('scholarweave-theme');
          if (saved === 'system' || themes.indexOf(saved) >= 0) preference = saved;
        } catch (error) {
          /* Storage can be unavailable; the default is fine. */
        }
        var resolved = preference;
        if (preference === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'nebula' : 'prism';
        }
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
