[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarweave-backend"
version = "0.1.0"
description = "Local-first research workspace and visual agent builder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "brotli>=1.1,<2",
  "docling>=2.118,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "onnxruntime>=1.23,<2",
  "openai-agents==0.19.4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pillow>=10.4,<12",
  "pypdf>=5.0,<6",
  "pypdfium2>=4.30,<5",
  "pytesseract>=0.3.13,<1",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
