[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarweave-backend"
version = "0.1.0"
description = "Local-first LLM research workspace with autonomous planning and paper OCR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "brotli>=1.1,<2",
  "ddgs>=9.11.2,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "openai>=1.99,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pillow>=10.4,<12",
  "pypdf>=5.0,<6",
  "pypdfium2>=4.30,<5",
  "pytesseract>=0.3.13,<1",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "stop-words>=2018.7.23,<2019",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.prompting" = ["defaults/**/*.md", "defaults/**/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
